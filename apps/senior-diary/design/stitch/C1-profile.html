<!DOCTYPE html>

<html lang="ko"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Harudam - Profile Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#c9c6bf",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#ffb59a",
                        "primary": "#943d16",
                        "inverse-on-surface": "#fbefe0",
                        "background": "#fff8f3",
                        "on-tertiary-fixed-variant": "#4d463c",
                        "surface-tint": "#9d431c",
                        "on-surface-variant": "#56423b",
                        "secondary-fixed": "#e6e2da",
                        "primary-fixed-dim": "#ffb59a",
                        "surface-bright": "#fff8f3",
                        "secondary-container": "#e6e2da",
                        "surface-container-high": "#f2e6d7",
                        "on-secondary-fixed-variant": "#484741",
                        "on-background": "#201b12",
                        "primary-fixed": "#ffdbce",
                        "tertiary-fixed": "#ede1d4",
                        "surface-container-highest": "#ece1d2",
                        "on-primary-fixed": "#370e00",
                        "inverse-surface": "#363025",
                        "surface-dim": "#e4d8c9",
                        "surface-container-low": "#fef2e2",
                        "on-primary-fixed-variant": "#7e2c05",
                        "on-secondary-fixed": "#1c1c17",
                        "secondary": "#605e58",
                        "on-error-container": "#93000a",
                        "surface": "#fff8f3",
                        "on-error": "#ffffff",
                        "surface-container": "#f8ecdd",
                        "outline-variant": "#dcc1b7",
                        "tertiary-fixed-dim": "#d0c5b9",
                        "on-secondary-container": "#66645e",
                        "error": "#ba1a1a",
                        "tertiary-container": "#786f65",
                        "on-tertiary-fixed": "#201b13",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#fff3ef",
                        "on-tertiary-container": "#fff4e9",
                        "on-secondary": "#ffffff",
                        "outline": "#89726a",
                        "tertiary": "#5f574d",
                        "surface-variant": "#ece1d2",
                        "on-surface": "#201b12",
                        "primary-container": "#b4542c",
                        "error-container": "#ffdad6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-page": "2rem",
                        "tap-target-min": "64px",
                        "stack-spacing": "1rem",
                        "gutter-block": "1.5rem"
                    },
                    "fontFamily": {
                        "headline-lg": ["'Gowun Batang'"],
                        "label-md": ["'Noto Sans KR'"],
                        "helper-text": ["'Noto Sans KR'"],
                        "story-body": ["'Gowun Batang'"],
                        "headline-lg-mobile": ["'Gowun Batang'"],
                        "label-lg": ["'Noto Sans KR'"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "1.4", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "label-md": ["16px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "helper-text": ["14px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "story-body": ["22px", { "lineHeight": "1.7", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "label-lg": ["18px", { "lineHeight": "1.2", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #FBF7EF;
            font-family: 'Noto Sans KR', sans-serif;
        }
        h1, h2, h3, .serif-heading {
            font-family: 'Gowun Batang', serif;
        }
        .ruled-input {
            background: transparent;
            border: none;
            border-bottom: 1px solid theme('colors.outline-variant');
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
            box-shadow: none !important;
        }
        .ruled-input:focus {
            border-bottom-color: theme('colors.primary');
            ring: 0;
            outline: none;
        }
        /* Toggle Switch Customization */
        .toggle-checkbox:checked {
            right: 0;
            border-color: theme('colors.primary-container');
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: theme('colors.primary-container');
        }
        .toggle-checkbox {
            right: 0;
            z-index: 1;
            border-color: theme('colors.outline-variant');
            transition: all 0.3s;
        }
        .toggle-label {
            width: 3rem;
            height: 1.5rem;
            background-color: theme('colors.surface-variant');
            border-radius: 9999px;
            transition: all 0.3s;
        }
        .toggle-dot {
            top: 0.125rem;
            left: 0.125rem;
            width: 1.25rem;
            height: 1.25rem;
            background-color: white;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .toggle-checkbox:checked ~ .toggle-dot {
            transform: translateX(1.5rem);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col text-on-background">
<!-- Top Navigation (Suppressed due to transactional intent, but keeping a minimal back button) -->
<header class="w-full flex items-center px-margin-page h-tap-target-min fixed top-0 z-50 bg-[#FBF7EF]/90 backdrop-blur-sm">
<button class="flex items-center gap-2 text-on-surface-variant font-label-md text-label-md py-2 pr-4 active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span>이전으로</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center px-margin-page pt-24 pb-32 max-w-2xl mx-auto w-full">
<!-- Header Section -->
<div class="w-full flex flex-col gap-4 mb-10">
<span class="font-label-md text-label-md text-primary tracking-widest">2 / 2</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background serif-heading">어머니를 더 알려주세요</h1>
<p class="font-story-body text-story-body text-on-surface-variant opacity-80 leading-relaxed">
                알려주실수록 질문이 어머니의 인생에 더 잘 맞아져요.
            </p>
</div>
<!-- Optional Profile Fields -->
<section class="w-full flex flex-col gap-8 mb-12">
<!-- 고향 -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="hometown">고향</label>
<input class="ruled-input font-story-body text-story-body w-full py-2 text-on-background focus:ring-0 focus:border-primary transition-colors" id="hometown" placeholder="예: 서울, 부산, 작은 마을 이름..." type="text" value="서울"/>
</div>
<!-- Soft Preview Card (Contextual) -->
<div class="bg-surface-container-low border border-outline-variant rounded-xl p-6 shadow-sm flex items-start gap-4">
<span class="material-symbols-outlined text-primary mt-1" data-icon="auto_awesome" data-weight="fill" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<p class="font-helper-text text-helper-text text-on-surface-variant leading-relaxed">
<strong>서울</strong>을 고르셨어요.<br/>
<span class="text-secondary opacity-70 mt-1 block">‘처음 서울에 올라오던 날’ 질문이 ‘어릴 적 살던 동네’ 질문으로 바뀌어요.</span>
</p>
</div>
<!-- 기타 정보 (칩/인풋 하이브리드) -->
<div class="flex flex-col gap-6 mt-4">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant">가족 구성</label>
<div class="flex flex-wrap gap-3">
<button class="px-6 py-3 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-highest transition-colors">결혼/사별/이혼</button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-highest transition-colors">형제 구성</button>
<button class="px-6 py-3 rounded-full border border-outline-variant bg-surface text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-highest transition-colors">자녀 구성</button>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="occupation">주로 하신 일</label>
<input class="ruled-input font-story-body text-story-body w-full py-2 text-on-background focus:ring-0 focus:border-primary transition-colors" id="occupation" placeholder="평생 해오신 일이나 역할..." type="text"/>
</div>
</div>
</section>
<!-- Divider -->
<hr class="w-full border-t border-outline-variant opacity-50 mb-12"/>
<!-- Sensitive Topics Section -->
<section class="w-full flex flex-col gap-6 mb-8">
<div class="flex flex-col gap-2 mb-2">
<h2 class="font-label-lg text-label-lg text-on-background">여쭙지 않을 이야기</h2>
<p class="font-helper-text text-helper-text text-on-surface-variant opacity-80">
                    가족마다 꺼내기 어려운 이야기가 있어요. 여기서 빼두면 여쭙지 않아요.
                </p>
</div>
<div class="flex flex-col gap-0 border-y border-outline-variant">
<!-- Toggle Item 1 -->
<div class="flex items-center justify-between py-6 border-b border-outline-variant">
<span class="font-story-body text-story-body text-on-background">배우자 이야기</span>
<div class="relative inline-block w-12 mr-2 align-middle select-none">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" id="toggle1" name="toggle1" type="checkbox"/>
<label class="toggle-label block overflow-hidden cursor-pointer" for="toggle1"></label>
<div class="toggle-dot absolute block w-5 h-5 rounded-full bg-white pointer-events-none"></div>
</div>
</div>
<!-- Toggle Item 2 -->
<div class="flex items-center justify-between py-6 border-b border-outline-variant">
<span class="font-story-body text-story-body text-on-background">투병 · 건강</span>
<div class="relative inline-block w-12 mr-2 align-middle select-none">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" id="toggle2" name="toggle2" type="checkbox"/>
<label class="toggle-label block overflow-hidden cursor-pointer" for="toggle2"></label>
<div class="toggle-dot absolute block w-5 h-5 rounded-full bg-white pointer-events-none"></div>
</div>
</div>
<!-- Toggle Item 3 -->
<div class="flex items-center justify-between py-6">
<span class="font-story-body text-story-body text-on-background">돈 · 재산</span>
<div class="relative inline-block w-12 mr-2 align-middle select-none">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer" id="toggle3" name="toggle3" type="checkbox"/>
<label class="toggle-label block overflow-hidden cursor-pointer" for="toggle3"></label>
<div class="toggle-dot absolute block w-5 h-5 rounded-full bg-white pointer-events-none"></div>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Fixed Action -->
<div class="fixed bottom-0 left-0 w-full px-margin-page py-6 bg-gradient-to-t from-[#FBF7EF] via-[#FBF7EF] to-transparent z-40 flex justify-center">
<button class="w-full max-w-2xl h-tap-target-min bg-primary-container text-on-primary-container font-label-lg text-label-lg rounded-xl shadow-sm hover:bg-surface-tint hover:text-white transition-all duration-200 active:scale-[0.98] active:shadow-inner flex items-center justify-center gap-2">
            다음으로
        </button>
</div>
</body></html>
