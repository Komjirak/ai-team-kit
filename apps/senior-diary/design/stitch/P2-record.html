        }

            0% { transform: scale(0.95); opacity: 0.8; }

<body class="bg-[#FBF7EF] text-on-surface min-h-screen flex flex-col items-center justify-between font-label-lg md:font-headline-lg">
<!-- TopAppBar -->
<header class="bg-transparent docked full-width top-0 w-full z-40">
<div class="flex justify-between items-center w-full px-margin-page py-4">
<button aria-label="뒤로 가기" class="flex items-center gap-2 text-on-surface-variant hover:bg-surface-variant rounded-lg p-2 transition-colors h-tap-target-min">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
<span class="font-label-lg text-label-lg">뒤로</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary font-bold tracking-tight">하루담</div>
<div class="w-[64px]"></div> <!-- Spacer for center alignment -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center w-full max-w-2xl px-margin-page py-8 text-center relative z-10 gap-12">
<!-- Story Prompt -->
<div class="space-y-4">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface opacity-90 leading-relaxed">
                "처음 서울에 올라오던 날…"
            </h1>
<div class="h-px bg-outline-variant w-24 mx-auto mt-6"></div>
</div>
<!-- Recording Indicator & Time -->
<div class="flex flex-col items-center justify-center space-y-8 my-8 relative">
<div class="relative w-40 h-40 flex items-center justify-center">
<div class="absolute inset-0 bg-primary-container rounded-full pulse-ring"></div>
<div class="absolute inset-4 bg-[#B4542C] rounded-full flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-white text-5xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<div class="font-label-lg text-4xl font-bold text-on-surface tabular-nums tracking-wider" id="timer">
                0:42
            </div>
</div>
<!-- Helper Text -->
<div class="space-y-2 mt-4">
<p class="font-story-body text-story-body text-on-surface-variant opacity-80">천천히, 편하게 말씀하세요.</p>
<p class="font-helper-text text-helper-text text-secondary opacity-70">쉬어가도 녹음은 이어져요.</p>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="w-full max-w-md px-margin-page pb-12 pt-4 relative z-20">
<button class="w-full bg-[#B4542C] text-white font-label-lg text-label-lg h-tap-target-min rounded-xl shadow-lg active:scale-95 transition-transform duration-200 flex items-center justify-center gap-3">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            다 했어요
        </button>
</footer>
<script>
        // Simple timer logic for demonstration
        let seconds = 42;
        const timerElement = document.getElementById('timer');
        
        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            timerElement.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    </script>
</body></html>
