</div>
</header>
<!-- Main Question Canvas -->
<section class="flex-1 flex flex-col items-center justify-center w-full my-12 px-4 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-[#2A241C] leading-snug max-w-[280px]">

            </h1>
</section>
<!-- Primary Action -->
<section class="w-full flex flex-col items-center gap-8 pb-8">
<button aria-label="이야기 녹음하기" class="relative group flex flex-col items-center justify-center w-32 h-32 rounded-full bg-primary-container text-on-primary-container shadow-md transition-transform active:scale-95 hover:bg-primary">
<div class="absolute inset-0 rounded-full bg-primary-container opacity-50 group-hover:pulse-animation -z-10"></div>
<span class="material-symbols-outlined text-[48px] mb-1" style="font-variation-settings: 'FILL' 1;">mic</span>

<button class="font-label-md text-label-md text-on-surface-variant underline underline-offset-4 decoration-outline-variant hover:text-on-surface min-h-[48px] px-4 flex items-center justify-center">
