<div class="flex-1 flex flex-col gap-2">

                    열아홉에 완행열차를 타고 올라왔어요. 서울역에 내리니 사람이 어찌나 많던지, 손에 쥔 주소 쪽지만 보고 걸었지요…
                    
                    처음 보는 높은 건물들과 번쩍이는 간판들 사이에서 작은 가방 하나 들고 서 있었던 기억이 아직도 생생해. 무섭기도 하고 설레기도 했던 그 밤 공기가 생각나네.
                </p>
