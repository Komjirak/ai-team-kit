  <path d="M25 24 C 23 26, 22.5 29, 23.5 31.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.2" stroke-linecap="round"/>
  <!-- sparkle -->
  <path d="M47 40 L48.2 43.4 L51.6 44.6 L48.2 45.8 L47 49.2 L45.8 45.8 L42.4 44.6 L45.8 43.4 Z" fill="#655689"/>
