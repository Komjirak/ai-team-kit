<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Datel.log">
  <defs>
    <clipPath id="page"><rect x="4" y="4" width="56" height="56" rx="15"/></clipPath>
  </defs>
  <!-- notebook page -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="#FFF3EA" stroke="#EBD9CC" stroke-width="1.5"/>
  <!-- faint grid -->
  <g clip-path="url(#page)" stroke="#88726D" stroke-opacity="0.14" stroke-width="1">
    <path d="M18 4V60M32 4V60M46 4V60M4 18H60M4 32H60M4 46H60"/>
  </g>
  <!-- washi tape, top-left -->
  <g transform="rotate(-18 20 15)">
    <rect x="6" y="9" width="28" height="11" rx="1.5" fill="#F9E392" fill-opacity="0.85"/>
    <rect x="6" y="9" width="28" height="11" rx="1.5" fill="none" stroke="#E7CB63" stroke-opacity="0.5"/>
  </g>
